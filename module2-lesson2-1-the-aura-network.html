:root{
  --navy:#142130; --navy-800:#2E4967; --navy-100:#D9E5F1;
  --purple:#AD4798; --purple-200:#DEB5D6; --purple-50:#F6ECF4; --purple-800:#4D1B42;
  --orange:#FF8114; --red:#EA3F34; --red-600:#BD3128;
  --grey-100:#E8ECEF; --grey-400:#A8B0BB; --grey-600:#5C6672;
  --surface:#FFFFFF; --surface-2:#F4F6F8; --ink:#142130; --ink-2:#5C6672; --line:#E8ECEF;
  --good:#1F7A4D; --accent-card:#142130; --good-bg:#E6F4EC; --bad-bg:#FBDFDE;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --surface:#142130; --surface-2:#1C2D41; --ink:#FFFFFF; --ink-2:#C9D3DE; --line:#2E4967;
  --good:#7FD3A6; --good-bg:#183A2B; --bad-bg:#4A1F22; --purple-50:#2A1C2B; --accent-card:#4D1B42; color-scheme:dark;}}
:root[data-theme="dark"]{
  --surface:#142130; --surface-2:#1C2D41; --ink:#FFFFFF; --ink-2:#C9D3DE; --line:#2E4967;
  --good:#7FD3A6; --good-bg:#183A2B; --bad-bg:#4A1F22; --purple-50:#2A1C2B; --accent-card:#4D1B42; color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--surface);color:var(--ink);font:400 18px/1.55 "Rethink Sans",Arial,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
h1,h2,h3{margin:0;line-height:1.15;font-weight:700}
p{margin:0}
button{font:inherit}
:focus-visible{outline:3px solid var(--purple);outline-offset:3px;border-radius:6px}

/* top bar with progress */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);color:#fff;padding:12px 24px;display:flex;align-items:center;gap:20px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
.bar img{height:26px;width:auto}
.bar .where{font-size:14px;color:var(--purple-200);white-space:nowrap}
.segs{display:flex;gap:4px;flex:1;min-width:80px}
.segs span{flex:1;height:4px;border-radius:2px;background:#2E4967}
.segs span.done{background:var(--purple-200)}
.segs span.now{background:var(--purple)}
.bar[hidden]{display:none}

.wrap{max-width:760px;margin:0 auto;padding:40px 24px 64px}
.screen-title{font-size:34px;margin-bottom:20px}
.lede{font-size:20px;color:var(--ink-2);margin-bottom:24px}
.btn{display:inline-block;border:0;cursor:pointer;background:var(--purple);color:#fff;font-weight:600;font-size:16px;padding:14px 26px;border-radius:999px;margin-top:28px}
.btn:hover{background:#963c83}
.btn.secondary{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* start screen */
.hero{background:var(--navy);color:#fff;min-height:calc(100vh - 0px)}
.hero-in{max-width:1100px;margin:0 auto;padding:48px 24px 64px;display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
.hero .course{color:var(--purple-200);font-size:16px;margin:28px 0 14px}
.ml-pill{display:inline-block;background:var(--purple);color:#fff;font-weight:700;font-size:20px;line-height:1;padding:12px 22px;border-radius:999px;margin-bottom:22px}
.hero h1{font-size:clamp(40px,6vw,64px)}
.hero h1 span{display:block;color:var(--purple-200);font-weight:600;font-size:.55em;margin-top:12px}
.hero .outcome{margin-top:28px;padding:20px 22px;border-left:4px solid var(--purple);background:#1C2D41;border-radius:0 10px 10px 0}
.hero .outcome b{display:block;color:var(--purple-200);font-weight:600;margin-bottom:6px;font-size:16px}
.hero .meta{margin-top:16px;color:var(--grey-400);font-size:15px}
.hero figure{margin:0}
.hero figure img{border-radius:16px;aspect-ratio:1/1;object-fit:cover;width:100%}
.hero .btn{margin-top:32px}

/* scenario */
.scenario{background:var(--navy);color:#fff}
.scenario .wrap{max-width:1000px}
.clock{font-size:clamp(56px,9vw,96px);font-weight:700;color:var(--purple);line-height:1;letter-spacing:-.02em}
.story{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:28px 0 24px}
.story figure{margin:0}
.story img{border-radius:10px;width:100%;aspect-ratio:1/1;object-fit:cover}
.story figcaption{font-size:15px;color:var(--navy-100);margin-top:8px}
.scenario p.big{font-size:22px;max-width:640px}
.choice{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.choice div{background:#1C2D41;border-radius:10px;padding:14px 18px;font-weight:600}
.choice div small{display:block;font-weight:400;color:var(--grey-400);font-size:15px}
label.ask{display:block;margin-top:32px;font-weight:600;color:var(--purple-200)}
textarea{width:100%;min-height:90px;margin-top:10px;border-radius:10px;border:2px solid #2E4967;background:#0F1A27;color:#fff;font:inherit;padding:12px 14px}

/* learn points */
.points{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:14px}
.points li{background:var(--surface-2);border-radius:12px;padding:18px 20px}
.points li b{display:block;font-size:19px;margin-bottom:4px}
.points li p{color:var(--ink-2)}
.points li.dark{background:var(--accent-card);color:#fff}
.points li.dark p{color:var(--navy-100)}
.note{margin-top:18px;font-size:16px;color:var(--ink-2)}

/* the response gap diagram */
.gap{margin:8px 0 28px;background:var(--surface-2);border-radius:14px;padding:22px 20px 16px}
.gap svg{width:100%;height:auto;display:block}
.gap .t{font:600 19px "Rethink Sans",Arial,sans-serif;fill:var(--ink)}
.gap .q{font:700 19px "Rethink Sans",Arial,sans-serif;fill:var(--ink)}
.gap circle.qc{fill:var(--surface);stroke:var(--grey-400);stroke-width:1.5}
.gap .track{stroke:var(--grey-400);stroke-width:2}
.gap .lbl{font:600 18px "Rethink Sans",Arial,sans-serif;fill:var(--purple)}
@media (prefers-reduced-motion:no-preference){
  .gap .qg{opacity:0;animation:pop .5s ease-out forwards}
  .gap .qg:nth-of-type(2){animation-delay:.2s}.gap .qg:nth-of-type(3){animation-delay:.35s}
  .gap .qg:nth-of-type(4){animation-delay:.5s}.gap .qg:nth-of-type(5){animation-delay:.65s}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}

/* police */
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
.split > div{border-radius:12px;padding:18px 20px;background:var(--surface-2)}
.split > div.wide{grid-column:1/-1}
.split.police{grid-template-columns:1.2fr .8fr;align-items:stretch}
.split .tag{display:inline-block}
.mapcard{background:#fff !important;display:grid;place-items:center}
.mapcard img{max-height:340px;width:auto}
.photo{margin:0 0 22px}
.photo img{border-radius:14px;width:100%;aspect-ratio:16/9;object-fit:cover}
.split b{display:block;margin-bottom:6px}
.split p{color:var(--ink-2)}
.tag{display:inline-block;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--purple-50);color:var(--purple);margin-bottom:8px}

/* activities */
.prompt{font-weight:600;margin:6px 0 16px}
.match{display:grid;gap:12px}
.match .row{display:grid;grid-template-columns:1fr;gap:12px;align-items:start;background:var(--surface-2);border-radius:12px;padding:14px 16px}
.match .sys{font-weight:700}
.match select{width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:8px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.match .row.y{box-shadow:inset 0 0 0 2px var(--good)}
.match .row.n{box-shadow:inset 0 0 0 2px var(--red)}
.fb{margin-top:18px;border-radius:12px;padding:16px 18px;background:var(--bad-bg)}
.fb.good{background:var(--good-bg)}
.fb b{display:block;margin-bottom:4px}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:14px 16px;cursor:pointer;font-weight:600}
.opt:hover:not([disabled]){border-color:var(--purple)}
.opt[disabled]{cursor:default}
.opt.tried{opacity:.6}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt small{display:block;font-weight:400;color:var(--ink-2);margin-top:4px}

/* image placeholder for images AURA still has to supply */
.ph{border:2px dashed var(--grey-400);border-radius:14px;padding:22px;color:var(--ink-2);font-size:15px;margin:4px 0 22px;background:var(--surface-2)}
.ph b{color:var(--ink);display:block;margin-bottom:4px}

/* debrief */
.takeaways{list-style:none;padding:0;margin:0;display:grid;gap:10px;counter-reset:t}
.takeaways li{counter-increment:t;display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start;font-size:19px;font-weight:600}
.takeaways li::before{content:counter(t);display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--purple);color:#fff;font-size:15px}
.yournote{margin-top:26px;background:var(--surface-2);border-radius:12px;padding:16px 18px}
.yournote b{display:block;color:var(--purple);margin-bottom:4px;font-size:15px}

/* quiz */
.qcount{color:var(--ink-2);font-size:15px;margin-bottom:8px}
.qtext{font-size:24px;font-weight:700;margin-bottom:18px}
.done-card{background:var(--accent-card);color:#fff;border-radius:16px;padding:28px}
.done-card p{color:var(--navy-100);margin-top:8px}

.foot{font-size:13px;color:var(--grey-600);text-align:center;padding:16px}
@media (max-width:760px){
  .hero-in{grid-template-columns:1fr;gap:28px}
  .hero figure{order:-1;max-width:360px}
  .story{grid-template-columns:1fr 1fr}
  .split,.split.police{grid-template-columns:1fr}
  .match .row{grid-template-columns:1fr}
  .match .sys{padding-top:0}
  .screen-title{font-size:28px}
  .bar .where{display:none}
}

.sorter{display:grid;gap:12px}
.srow{background:var(--surface-2);border-radius:12px;padding:14px 16px}
.srow .nm{font-weight:700;margin-bottom:10px}
.cats{display:flex;gap:8px;flex-wrap:wrap}
.cat{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:15px}
.cat svg{width:20px;height:20px;stroke:var(--purple);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cat[aria-pressed="true"]{border-color:var(--purple);background:var(--purple-50)}
.srow.y{box-shadow:inset 0 0 0 2px var(--good)}.srow.n{box-shadow:inset 0 0 0 2px var(--red)}
.reveal{display:grid;gap:12px;margin-top:22px}
.reveal div{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start;background:var(--surface-2);border-radius:12px;padding:16px 18px}
.reveal .ic{width:44px;height:44px;border-radius:12px;background:var(--purple-50);display:grid;place-items:center}
.reveal .ic svg{width:24px;height:24px;stroke:var(--purple);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.reveal b{display:block;margin-bottom:4px}.reveal p{color:var(--ink-2)}
.withphone{display:grid;grid-template-columns:1fr 260px;gap:36px;align-items:center}
.withphone img{width:100%;height:auto}
.stats{display:grid;gap:12px;margin-top:6px}
.stats div{background:var(--surface-2);border-radius:12px;padding:16px 18px}
.stats b{display:block;font-size:30px;color:var(--purple);line-height:1.1}
.stats span{color:var(--ink-2)}
.scen-img{border-radius:14px;width:100%;aspect-ratio:16/9;object-fit:cover;margin:6px 0 22px}
.qbox{background:var(--accent-card);color:#fff;border-radius:12px;padding:18px 20px}
.qbox b{color:var(--purple-200);display:block;margin-bottom:6px}
.pull{margin:0 0 14px;padding:4px 0 4px 22px;border-left:5px solid var(--purple);font-size:clamp(26px,3.6vw,36px);font-weight:700;line-height:1.2;color:var(--ink)}
.qbox p{color:#fff}
.fit-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.fit-tab{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 16px;font-weight:600;font-size:15px;cursor:pointer}
.fit-tab.seen{border-color:var(--purple-200)}
.fit-tab[aria-selected="true"]{background:var(--purple);border-color:var(--purple);color:#fff}
.fit-card{display:grid;grid-template-columns:52px 1fr;gap:16px;background:var(--surface-2);border-radius:14px;padding:22px}
.fit-card .ic{width:52px;height:52px;border-radius:14px;background:var(--purple-50);display:grid;place-items:center}
.fit-card .ic svg{width:28px;height:28px;stroke:var(--purple);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fit-card h3{font-size:22px;margin-bottom:10px}
.fit-card p{margin-top:10px}
.fit-card p b{display:block;font-size:14px;color:var(--purple);margin-bottom:2px}
.fit-card .fgap{color:var(--ink-2)}
.fit-card .ffit{font-size:19px;font-weight:600}
@media (max-width:760px){.fit-card{grid-template-columns:1fr}}

.sub{font-size:22px;margin:30px 0 4px}
.opt-pills{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.opt-pills span{background:var(--purple);color:#fff;font-weight:600;font-size:15px;padding:6px 14px;border-radius:999px}
.twoq{margin:12px 0 0;padding:0;list-style:none;counter-reset:q;display:grid;gap:10px}
.twoq li{counter-increment:q;display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:center;font-size:19px;font-weight:600}
.twoq li::before{content:counter(q);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#fff;color:var(--navy);font-size:15px}

@media (max-width:760px){.withphone{grid-template-columns:1fr}.withphone figure{order:-1;max-width:240px;margin:0 auto}}

/* Lesson 2.1 */
.reveal .ic.num{font-weight:700;color:var(--purple);font-size:20px}
.ph b{color:var(--ink);display:block;margin-bottom:4px}
.ph.flow-ph{min-height:160px;display:flex;flex-direction:column;justify-content:center}
.stats.three{grid-template-columns:repeat(3,1fr);margin:18px 0 6px}
.olist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.orow{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;background:var(--surface-2);border-radius:12px;padding:12px 14px}
.orow.y{box-shadow:inset 0 0 0 2px var(--good)}.orow.n{box-shadow:inset 0 0 0 2px var(--red)}
.opos{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--purple);color:#fff;font-weight:700;font-size:15px}
.otxt b{display:block}.otxt small{display:block;color:var(--ink-2);font-size:15px;line-height:1.45;margin-top:2px}
.omv{display:flex;flex-direction:column;gap:6px}
.mv{width:40px;height:36px;border-radius:8px;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;padding:0}
.mv svg{width:20px;height:20px;stroke:var(--purple);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.mv:hover:not([disabled]){border-color:var(--purple)}
.mv[disabled]{opacity:.35;cursor:default}
@media (max-width:760px){.stats.three{grid-template-columns:1fr}}

.flow{margin:4px 0 22px;background:var(--surface-2);border-radius:14px;padding:26px 14px 22px}
.flow ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,1fr)}
.flow li{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.flow li:not(:last-child)::after{content:"";position:absolute;top:33px;left:calc(50% + 42px);right:calc(-50% + 42px);height:2px;background:var(--purple-200)}
.flow li:not(:last-child)::before{content:"";position:absolute;top:29px;right:calc(-50% + 42px);width:8px;height:8px;border-top:2px solid var(--purple-200);border-right:2px solid var(--purple-200);transform:rotate(45deg)}
.fic{position:relative;width:68px;height:68px;border-radius:50%;background:var(--purple-50);box-shadow:inset 0 0 0 2px var(--purple-200);display:grid;place-items:center}
.fic svg{width:30px;height:30px;stroke:var(--purple);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fnum{position:absolute;top:-4px;right:-6px;width:24px;height:24px;border-radius:50%;background:var(--purple);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center}
.flabel{font-weight:700;font-size:16px;color:var(--ink)}
@media (max-width:760px){
 .flow{padding:20px 18px}
 .flow ol{grid-template-columns:1fr;gap:18px}
 .flow li{flex-direction:row;text-align:left;gap:16px}
 .flow li:not(:last-child)::after{top:68px;left:33px;right:auto;width:2px;height:18px}
 .flow li:not(:last-child)::before{display:none}
}

/* v2: no orphans */
h1,h2,h3,.qtext,.lede,.pull{text-wrap:balance}
p,li{text-wrap:pretty}
/* v2: course welcome */
.wband{background:var(--navy);padding:16px 24px}.wband img{height:28px;width:auto}.wband > div{max-width:860px;margin:0 auto}
.welcome .wrap{max-width:860px}
.welcome h1{font-size:clamp(32px,4.6vw,46px);margin-bottom:16px}
.welcome .lede{margin-bottom:10px}
.welcome .struct{font-size:17px;color:var(--ink-2);margin-bottom:26px}
.mods{list-style:none;padding:0;margin:0;display:grid;gap:12px;counter-reset:m}
.mods li{counter-increment:m;display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start;background:var(--surface-2);border-radius:12px;padding:16px 18px}
.mods li::before{content:counter(m);display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--navy-800);color:#fff;font-weight:700;font-size:16px}
.mods li b{display:block;font-size:18px;margin-bottom:2px}
.mods li p{color:var(--ink-2);font-size:16px}
.mods li.here{box-shadow:inset 0 0 0 2px var(--purple);background:var(--purple-50)}
.mods li.here::before{background:var(--purple)}
.here-pill{border:0;cursor:pointer;font-family:inherit;display:inline-block;margin-top:10px;background:var(--purple);color:#fff;font-size:14px;font-weight:600;padding:4px 12px;border-radius:999px}
.here-pill:hover{background:#963c83}
/* v2: tap to reveal */
.rv-count{font-size:15px;color:var(--ink-2);margin:14px 0 0}
.reveal button.rv{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start;background:var(--surface-2);border-radius:12px;padding:16px 18px;width:100%;text-align:left;border:0;cursor:pointer;font:inherit;color:var(--ink)}
.reveal button.rv b{display:block;margin-bottom:4px}
.reveal button.rv .d{display:block;color:var(--ink-2)}
.reveal .ic.num{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--purple-50);font-weight:700;color:var(--purple);font-size:20px}
.reveal button.rv:not(.open){box-shadow:inset 0 0 0 2px var(--line);background:transparent}
.reveal button.rv:not(.open) .d{color:var(--purple);font-weight:600;font-size:15px}
.reveal button.rv:not(.open):hover{box-shadow:inset 0 0 0 2px var(--purple)}
@media (prefers-reduced-motion:no-preference){.reveal button.rv.fresh{animation:rvpop .4s ease-out}@keyframes rvpop{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
/* v2: end screens */
.done-card h2{font-size:32px}
.next2{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:12px}
.next2 li{background:var(--surface-2);border-radius:12px;padding:16px 18px}
.next2 li b{display:block;margin-bottom:4px}
.next2 li p{color:var(--ink-2)}
.sub.up{font-size:20px;margin-top:28px}
.done-card.big{padding:36px 32px}
.done-card.big h2{font-size:clamp(28px,4vw,38px)}
.done-pill{display:inline-block;background:var(--purple);color:#fff;font-weight:700;font-size:15px;padding:6px 14px;border-radius:999px;margin-bottom:16px}
.ticks{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.ticks span{background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600}
.did{margin:10px 0 0;padding-left:20px;color:var(--navy-100)}
.did li{margin-top:6px}

/* v2: step-by-step reveal */
.stepctl{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:4px 0 18px}
.stepctl .btn{margin-top:0}
.stepctl .rv-count{margin:0}
.reveal > div.locked{background:transparent;box-shadow:inset 0 0 0 2px var(--line)}
.reveal > div.locked b{color:var(--ink-2)}
@media (prefers-reduced-motion:no-preference){.reveal > div.fresh{animation:rvpop .4s ease-out}}
.flow li{transition:opacity .3s}
.flow li:not(.on){opacity:.3}
.creds{list-style:none;padding:0;margin:0 0 22px;display:flex;flex-wrap:wrap;gap:10px}
.creds li{background:var(--purple-50);color:var(--ink);font-weight:600;font-size:16px;padding:8px 14px;border-radius:999px}
</style>
</head>

    const lock = S.checked && allRight;
    return `<li class="orow ${cls}"><span class="opos">${i+1}</span><span class="otxt"><b>${f.name}</b><small>${esc(f.d)}</small></span>
      <span class="omv"><button class="mv" data-mv="${i}" data-dir="-1" aria-label="Move ${f.name} up" ${i===0||lock?"disabled":""}>${UP}</button><button class="mv" data-mv="${i}" data-dir="1" aria-label="Move ${f.name} down" ${i===n-1||lock?"disabled":""}>${DN}</button></span></li>`;
  }).join("");
  let tail;
  if (!S.checked) tail = `<button class="btn" data-act="ocheck">Check my order</button>`;
  else if (!allRight) tail = `<div class="fb"><b>Not quite.</b><p>Move the steps marked in red, then check again.</p></div><button class="btn" data-act="ocheck">Check again</button>`;
  else tail = `<div class="fb good"><b>All five in order.</b><p>Alert, controller, selection, acceptance, arrival.</p></div>${next("Continue",4)}`;
  return `<section><div class="wrap">
    <h2 class="screen-title">Put the steps in order</h2>
    <p class="prompt">The steps appear shuffled. Put them in order.</p>
    <ol class="olist">${rows}</ol>${tail}
  </div></section>`;
},

// 4 accredited network
() => `<section><div class="wrap">
  <h2 class="screen-title">An accredited network</h2>
  <figure class="photo"><img src="${IMG.resp}" alt="A responder beside a response vehicle."></figure>
  <ul class="creds"><li>ACS accredited in guarding and keyholding</li><li>Officers screened to BS 7858</li><li>Aligned to BS 7984-1:2016</li><li>ISO 27001 certified</li></ul>
  <div class="stats three">
    <div><b>5,000+</b><span>SIA vetted security officers</span></div>
    <div><b>3,500+</b><span>response vehicles</span></div>
    <div><b>180+</b><span>ACS accredited network partners</span></div>
  </div>
  <p class="note" style="color:var(--ink)">AURA works alongside the ARC and the police, and isn't a substitute for the police or other emergency services.</p>
  ${next("Continue",5)}
</div></section>`,

// 5 takeaways
() => `<section><div class="wrap">
  <h2 class="screen-title">Key takeaways</h2>
  <ol class="takeaways">
    <li>Alert from the ARC or the app.</li>
    <li>A controller manages it.</li>
    <li>The nearest qualified responder is typically en route within 60 seconds, and every callout ends with a timestamped report.</li>
  </ol>
  ${next("Take the quiz",6)}
</div></section>`,

// 6 quiz
() => {
  const Q=QUIZ[S.q];
  const opts=Q.o.map((t,i)=>{const tried=S.tried.includes(i);const cls=S.solved&&i===Q.a?"right":tried?"tried":"";
    return `<button class="opt ${cls}" data-ans="${i}" ${S.solved||tried?"disabled":""}><span style="color:var(--purple)">${"ABCD"[i]})</span> ${esc(t)}</button>`;}).join("");
  const wrong=!S.solved&&S.tried.length;
  return `<section><div class="wrap">
    <p class="qcount">Question ${S.q+1} of ${QUIZ.length}</p>
    <h2 class="qtext">${esc(Q.q)}</h2>
    <div class="opts">${opts}</div>
    ${S.solved?`<div class="fb good"><b>That's right.</b><p>${esc(Q.why)}</p></div>${S.q<QUIZ.length-1?`<button class="btn" data-act="qnext">Next question</button>`:`<button class="btn" data-go="7">Finish</button>`}`
      : wrong?`<div class="fb"><b>Not quite.</b><p>Try again.</p></div>`:""}
  </div></section>`;
},

// 7 done
() => `<section><div class="wrap">
  <div class="done-card">
    <h2>Well done, you've completed Lesson 2.1.</h2>
    <p>You can now describe the sequence from alert to arrival, including the control room's role and how the nearest qualified responder is chosen.</p>
  </div>
  <h3 class="sub up">Still to come in Module 2</h3>
  <ul class="next2">
    <li><b>Lesson 2.2: Response routes</b><p>How to choose the right route for a customer: monitored, not monitored, or a mix of both.</p></li>
    <li><b>Lesson 2.3: The data loop</b><p>The site information a responder needs, how it's kept safe, and how the incident report closes the loop.</p></li>
  </ul>
  <button class="btn secondary" data-act="restart">Start again</button>
</div></section>`
];

function render(focus){
  $("#stage").innerHTML = S.welcome ? WELCOME() : SCREENS[S.screen](); FRESH = null; bar();
  if (focus){ window.scrollTo(0,0); const h=$("#stage h1, #stage h2"); if(h){h.setAttribute("tabindex","-1");h.focus({preventScroll:true});} }
}
document.addEventListener("click", e => {
  const t=e.target.closest("button"); if(!t) return;
  if (t.dataset.act==="nextstep"){ S.step++; FRESH="step"; render(); const nb=document.querySelector('[data-act="nextstep"]')||document.querySelector('[data-go="3"]'); if(nb) nb.focus({preventScroll:true}); return; }
  if (t.dataset.act==="begin"){ S.welcome=false; S.screen=0; render(true); return; }
  if (t.dataset.rv){ OPEN.add(t.dataset.rv); FRESH=t.dataset.rv; render(); const el=document.querySelector(`[data-rv="${t.dataset.rv}"]`); if(el) el.focus({preventScroll:true}); return; }
  if (t.dataset.go){ S.screen=+t.dataset.go; render(true); return; }
  if (t.dataset.mv){ const i=+t.dataset.mv, j=i+(+t.dataset.dir); [S.order[i],S.order[j]]=[S.order[j],S.order[i]]; S.checked=false; render();
    const b=document.querySelector(`[data-mv="${j}"][data-dir="${t.dataset.dir}"]`)||document.querySelector(`[data-mv="${j}"]`); if(b) b.focus(); return; }
  if (t.dataset.ans){ const i=+t.dataset.ans; if(i===QUIZ[S.q].a) S.solved=true; else S.tried.push(i); render(); return; }
  const a=t.dataset.act;
  if (a==="ocheck"){ S.checked=true; render(); }
  if (a==="qnext"){ S.q++; S.tried=[]; S.solved=false; render(true); }
  if (a==="restart"){ OPEN.clear(); Object.assign(S,{welcome:true,step:1,screen:0,order:[...START],checked:false,q:0,tried:[],solved:false}); render(true); }
});
render();
})();
</script>
</body>
